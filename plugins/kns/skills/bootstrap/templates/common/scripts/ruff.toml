# 하네스 스크립트(원본 tools/harness/shared → 단위마다 같은 사본)의 ruff 설정.
# 단위 pyproject 의 ruff 는 제품 코드 규칙이고, 단위 게이트가 `ruff check .` 로 이 폴더까지 읽는다. ruff 는 가장 가까운 설정을
# 쓰므로 하네스 스크립트는 이 파일을 따른다 — 사람이 읽는 긴 안내 문장과 테스트용 코드 조각 글이 많아 줄 길이만 넓히고,
# sys.path 를 먼저 맞춰야 하는 진입 파일의 import 위치(E402)를 허용한다. 고르는 규칙은 Python 단위와 같다.
line-length = 160
target-version = "py313"

[lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "TID", "RUF", "ASYNC", "S110", "S112"]
ignore = ["E402"]

[lint.per-file-ignores]
"tests/**" = ["S101", "N802"]
