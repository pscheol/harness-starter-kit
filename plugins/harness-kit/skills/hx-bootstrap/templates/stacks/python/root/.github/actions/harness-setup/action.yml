# HARNESS STARTER KIT ({{PROJECT_NAME}}) — CI 실행 환경 준비(Python). .github/workflows/harness-verify.yml 이 부른다.
#
# 검증은 하지 않는다(검증은 scripts/verify.sh 한 곳). 런타임 · 의존성 · 분석기 설치만 둔다.
# 분석기(.agents/analyzers.json)는 킷이 설치하지 않는다. required 분석기(gitleaks · semgrep · osv-scanner)가 없으면 CI 검증이 실패한다.
# 설치 예(팀이 버전을 고정해 아래 steps 에 더한다):
#   - shell: bash
#     run: pipx install semgrep==<판>
#   - shell: bash
#     run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@<판>
#   gitleaks 는 릴리스 바이너리를 받아 PATH 에 둔다.
name: harness-setup
description: 하네스 검증 실행 환경(Python)
runs:
  using: composite
  steps:
    # Python — .agents/rules/tech.md 기준(예시 3.12). pyproject.toml 의 requires-python 과 맞춘다.
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    # uv 설치 + 캐시. Poetry 프로젝트면 snok/install-poetry 로 바꾼다.
    - uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    # 잠금 파일 기준 동결 설치 — CI 가 로컬과 같은 의존성 트리를 쓴다.
    - name: 의존성 설치(frozen)
      shell: bash
      run: uv sync --frozen --all-extras --dev
