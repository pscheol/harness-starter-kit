# HARNESS STARTER KIT ({{PROJECT_NAME}}) — CI 검증 트리거(Go).
#
# 이 워크플로는 로직을 담지 않는다. 검증 게이트인 scripts/verify.sh **한 곳만** 호출한다
# ("1곳 + N트리거": hook·pre-commit·CI 가 모두 같은 스크립트를 부른다. 규칙 복제 금지).
name: verify

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Go — .agents/rules/tech.md 기준(예시 1.22, go.mod 의 go 지시자와 맞춘다).
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      # 게이트가 호출하는 도구를 미리 설치한다(버전은 프로젝트에서 고정).
      - name: Install tools
        run: |
          go install mvdan.cc/gofumpt@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: binary
          args: --version   # 설치만 하고 실행은 verify.sh 가 담당한다(게이트 1곳 원칙)

      # 검증 게이트 한 곳만 호출(exec-plan 일관성 + fmt + build + vet + lint + test -race + 커버리지).
      - name: Run verify gate
        run: bash scripts/verify.sh
