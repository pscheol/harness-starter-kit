# HARNESS STARTER KIT ({{PROJECT_NAME}}) — GitHub Actions 검증 트리거(설계 09 §3.7).
#
# 검증 단계는 scripts/verify.sh 만 부른다. 판정 로직은 이 파일에 두지 않는다.
#   fast      모든 push · PR
#   affected  PR. base 브랜치의 검증 코드 · 설정으로 판정한다(PR 이 바꾼 검증 코드 · 기준은 병합 뒤부터 적용된다)
#   full      야간 schedule · 수동 실행. 기준선 갱신은 사람이 base 브랜치에서 python3 scripts/harness/quality.py baseline --update
# 실행 환경(언어 런타임 · 의존성 · 분석기 설치)은 ./.github/actions/harness-setup 이 준비한다. 킷은 분석기를 설치하지 않는다.
# 이 파일 · .github/actions/ · scripts/verify.sh · scripts/harness/ · .agents/*.json 은 CODEOWNERS 로 승인자를 건다.
name: harness-verify

# 배포 작업(deploy-verify · deploy-production)은 선택이다. scripts/harness/deploy.py 만 부른다(설계 14 §3.5).
#   deploy-verify      base 브랜치 push(병합)마다 검증 환경에 배포하고 E2E 를 한 번 돈다. 연속 2회 실패하면 멈추고,
#                      사람이 workflow_dispatch 로 수동 실행하며 resume 을 켜야 다시 배포한다. .agents/deploy.json 이 꺼져 있으면 '꺼짐'으로 끝난다
#   deploy-production  사람이 workflow_dispatch 로 실행하고 record 에 배포 기록 경로를 넣는다. deploy.py 가 deploy 승인을 먼저 검사한다
on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      record:
        description: "운영 배포할 배포 기록 경로(.agents/docs/ops/deploys/…md). 비우면 운영 배포를 하지 않는다"
        required: false
      resume:
        description: "자동 검증 배포가 멈춘 뒤 다시 배포한다(true)"
        required: false

concurrency:
  group: harness-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write   # affected 끝에서 verify.sh 가 MR 요약 코멘트 scan 구간 하나를 고친다(설계 09 §3.7 "보고")

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 실행 환경 준비
        uses: ./.github/actions/harness-setup

      - name: fast
        run: bash scripts/verify.sh --fast

      - name: affected (base 판 판정)
        if: github.event_name == 'pull_request'
        env:
          HX_BASE_REF: origin/${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .agents/state
          git show "$HX_BASE_REF:scripts/verify.sh" > .agents/state/verify-base.sh || true
          git show "$HX_BASE_REF:scripts/verify-entry.sh" > .agents/state/verify-entry.sh || true
          if [ -s .agents/state/verify-base.sh ] && grep -q -- --from-base .agents/state/verify-entry.sh; then bash .agents/state/verify-base.sh --from-base "$HX_BASE_REF" --affected; else bash scripts/verify.sh --affected --bootstrap; fi

      - name: full
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: bash scripts/verify.sh --full

      - name: SARIF 업로드
        if: always() && hashFiles('.agents/reports/sarif/latest/*.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .agents/reports/sarif/latest

      - name: 보고서 보관
        if: always() && hashFiles('.agents/reports/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: harness-reports
          path: .agents/reports/
          retention-days: 14

  # PR 이 검증 코드 · 설정을 바꿨을 때만 head 판으로 한 번 더 돈다. 정보용이라 실패해도 PR 을 막지 않는다.
  affected-head:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 실행 환경 준비
        uses: ./.github/actions/harness-setup

      - name: affected (head 판, 정보용)
        env:
          HX_BASE_REF: origin/${{ github.base_ref }}
        run: git diff --quiet "$HX_BASE_REF...HEAD" -- scripts/verify.sh scripts/verify-entry.sh scripts/verify-changed.py scripts/harness .agents/verify-checks.json .agents/quality-gate.json .agents/analyzers.json .agents/deploy.json .agents/quality-baseline.json || bash scripts/verify.sh --affected

  deploy-verify:
    name: deploy-verify
    if: >-
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', vars.HX_BASE_BRANCH || 'develop'))
      || (github.event_name == 'workflow_dispatch' && inputs.resume == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: harness-verify-env
      cancel-in-progress: false
    env:
      HX_BASE_BRANCH: ${{ vars.HX_BASE_BRANCH || 'develop' }}
      HX_DEPLOY_RESUME: ${{ inputs.resume }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 실행 환경 준비
        uses: ./.github/actions/harness-setup

      - name: 직전 실행 결과 읽기
        continue-on-error: true
        run: python3 scripts/harness/deploy.py history --platform github --base "$HX_BASE_BRANCH"

      - name: 검증 환경 배포
        run: python3 scripts/harness/deploy.py auto-verify

      - name: 배포 보고서 보관
        if: always() && hashFiles('.agents/reports/deploy/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: harness-deploy-reports
          path: .agents/reports/deploy/
          retention-days: 30

  deploy-production:
    name: deploy-production
    if: github.event_name == 'workflow_dispatch' && inputs.record != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: harness-production
      cancel-in-progress: false
    env:
      HX_DEPLOY_RECORD: ${{ inputs.record }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 실행 환경 준비
        uses: ./.github/actions/harness-setup

      - name: 운영 배포(승인 검사 포함)
        run: python3 scripts/harness/deploy.py run --env production --record "$HX_DEPLOY_RECORD"
