# HARNESS STARTER KIT ({{PROJECT_NAME}}) — GitLab CI 검증 단계(설계 09 §3.7). 킷이 깐 파일이다(주인 kit).
#
# 리포의 .gitlab-ci.yml 이 include 한다(진입 파일은 ci 모듈이 깐다 — knots-sync add ci. 진입 파일이 없으면 돌지 않는다).
# 검증 단계는 scripts/verify.sh 만 부른다.
#   harness:fast           모든 파이프라인
#   harness:affected       MR. base 브랜치의 검증 코드 · 설정으로 판정한다(MR 이 바꾼 판은 병합 뒤부터 적용된다)
#   harness:affected-head  MR 이 검증 코드 · 설정을 바꿨을 때 head 판으로 한 번 더(정보용, 실패해도 MR 을 막지 않는다)
#   harness:full           schedule. 기준선 갱신은 사람이 base 브랜치에서 python3 scripts/harness/quality.py baseline --update
# 실행 환경(이미지 · 런타임 · 분석기 설치)은 .knots-sync-setup 을 리포 .gitlab-ci.yml 에서 덮어 넣는다. 킷은 분석기를 설치하지 않는다.
#   harness:deploy-verify      선택(.agents/deploy.json autoVerify.enabled). base 브랜치 push(병합)마다 검증 환경에 배포하고 E2E 를 한 번 돈다.
#                              연속 2회 실패하면 멈춘다 — 사람이 파이프라인을 수동 실행하며 KNS_DEPLOY_RESUME=true 를 넣어야 다시 배포한다(설계 14 §3.5)
#   harness:deploy-production  선택. 사람이 수동 실행하고 KNS_DEPLOY_RECORD 에 배포 기록 경로를 넣는다. deploy.py 가 deploy 승인을 먼저 검사한다
# 배포 작업은 scripts/harness/deploy.py 만 부른다. 자동 검증 배포는 .agents/deploy.json 이 꺼져 있으면 '꺼짐'을 내고 끝난다.

stages:
  - fast
  - affected
  - full
  - deploy

variables:
  KNS_BASE_BRANCH: "develop"   # 병합 대상(base) 브랜치. 팀이 바꾼다

# MR 요약 코멘트(설계 09 §3.7 "보고"): affected 끝에서 verify.sh 가 glab 으로 scan 구간 하나를 고친다. CI_JOB_TOKEN 은 노트를 쓰지 못하므로
# api 범위 프로젝트 토큰을 마스킹한 CI 변수 GITLAB_TOKEN 으로 둔다. glab · 토큰이 없으면 경고 한 줄이고 판정은 그대로다.
.knots-sync-setup:
  variables:
    GIT_DEPTH: "0"
    GITLAB_HOST: "$CI_SERVER_HOST"

harness:fast:
  extends: .knots-sync-setup
  stage: fast
  script:
    - bash scripts/verify.sh --fast

harness:affected:
  extends: .knots-sync-setup
  stage: affected
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    KNS_BASE_REF: "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
  script:
    - git fetch --quiet origin "+refs/heads/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME:refs/remotes/origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - mkdir -p .agents/state
    - git show "$KNS_BASE_REF:scripts/verify.sh" > .agents/state/verify-base.sh || true
    - git show "$KNS_BASE_REF:scripts/verify-entry.sh" > .agents/state/verify-entry.sh || true
    - if [ -s .agents/state/verify-base.sh ] && grep -q -- --from-base .agents/state/verify-entry.sh; then bash .agents/state/verify-base.sh --from-base "$KNS_BASE_REF" --affected; else bash scripts/verify.sh --affected --bootstrap; fi
  artifacts:
    when: always
    paths:
      - .agents/reports/
    expire_in: 14 days

harness:affected-head:
  extends: .knots-sync-setup
  stage: affected
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - scripts/verify.sh
        - scripts/verify-entry.sh
        - scripts/verify-changed.py
        - scripts/harness/**/*
        - .agents/verify-checks.json
        - .agents/verify-checks.d/**/*
        - .agents/quality-gate.json
        - .agents/analyzers.json
        - .agents/deploy.json
        - .agents/quality-baseline.json
  allow_failure: true
  script:
    - bash scripts/verify.sh --affected

harness:full:
  extends: .knots-sync-setup
  stage: full
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - bash scripts/verify.sh --full
  artifacts:
    when: always
    paths:
      - .agents/reports/
    expire_in: 30 days

# 선택: 병합 뒤 검증 환경 배포(설계 14 §3.5). 한 번에 하나만 배포한다(resource_group).
harness:deploy-verify:
  extends: .knots-sync-setup
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == $KNS_BASE_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_BRANCH == $KNS_BASE_BRANCH && $KNS_DEPLOY_RESUME == "true"'
  resource_group: harness-verify-env
  script:
    - python3 scripts/harness/deploy.py history --platform gitlab --base "$KNS_BASE_BRANCH" || true
    - python3 scripts/harness/deploy.py auto-verify
  artifacts:
    when: always
    paths:
      - .agents/reports/deploy/
    expire_in: 30 days

# 선택: 운영 배포. 배포 승인 검사는 deploy.py run 이 배포 명령 앞에서 한다. 자기 배포 시스템을 쓰면 그 첫 단계에 deploy.py check --require-approved 를 넣는다.
harness:deploy-production:
  extends: .knots-sync-setup
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == $KNS_BASE_BRANCH'
      when: manual
  resource_group: harness-production
  script:
    - python3 scripts/harness/deploy.py run --env production --record "$KNS_DEPLOY_RECORD"
  artifacts:
    when: always
    paths:
      - .agents/reports/deploy/
    expire_in: 30 days
