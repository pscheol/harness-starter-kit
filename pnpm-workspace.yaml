packages:
  - "packages/*"

# esbuild 설치 스크립트는 플랫폼 바이너리를 확인한다(packages/cli 빌드, HK-8).
allowBuilds:
  esbuild: true

# packages/cli 는 Node 18 API 만 쓰도록 @types/node 18 로 타입 검사한다.
# vitest · vite 의 @types/node 피어 범위(20 이상)는 개발 도구 쪽 요구라 넘긴다.
peerDependencyRules:
  allowedVersions:
    "@types/node": "18"
